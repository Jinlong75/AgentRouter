name: verify
on:
  push:
    branches: [main, 'stage/**']
  pull_request:
  # 手动触发：单独复现某项界面检查（例如 focus=UI05、repeat=30），或开运行期探针跑完整界面验收（probe=1）；只跑 gui 作业。
  # 这两种都是专项实验，不计作完整界面回归（完整回归看 push / pull_request 触发的运行）。
  workflow_dispatch:
    inputs:
      focus:
        description: '只跑这一项（UI05、UI17-fail、newtask-load、core-spawn）；留空跑完整界面验收'
        required: false
        default: ''
      repeat:
        description: '单独复现时重复的轮数'
        required: false
        default: '30'
      probe:
        description: '1 = 完整界面验收期间开运行期对照探针（Electron-as-Node / node.exe 交替启动，见 shots-probe.ts）'
        required: false
        default: ''
      # 环境诊断实验（PR #5 CI）：baseline 只记录；storsvc 只停存储服务；compattel 只停启动 CompatTelRunner 的计划任务与进程。
      # 只在这台一次性运行器上临时生效，不是修复、不计作正式回归（见 tools/ci-env-experiment.ps1）。
      envtest:
        description: '环境诊断实验组：baseline / storsvc / compattel；留空不做'
        required: false
        default: ''
      # H1 隔离实验（诊断用，只手动触发，不计入稳定性验收；工具见 tools/h1-sampler.mjs）：
      # quiet = 单独跑安静条件采样；load = 界面验收期间带负载采样。留空不跑。
      h1:
        description: 'H1 实验：quiet / load；留空不跑'
        required: false
        default: ''
jobs:
  windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # verify 不启动 Electron，省下载时间
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:tree
      - run: npm run verify
  # H1 隔离实验的安静条件：只手动触发（workflow_dispatch 且 h1=quiet），不挂在 push / pull_request 上。
  # 独立 Node 固定 24.21.0，与 Electron 43.7.5 内置的 Node 版本一致；不一致时采样器会在输出里醒目标出。
  # 诊断用，不计入稳定性验收。
  h1:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.h1 == 'quiet'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: node tools/h1-sampler.mjs --quiet
  # 界面验收（真实输入、每页通用检查、UI 基线）。验收窗口不显示，不需要桌面会话。
  gui:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.h1 != 'quiet'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 只有 H1 负载实验要用与 Electron 内置 Node 相同的版本（24.21.0），其余情况仍是 24。
          node-version: ${{ github.event.inputs.h1 == 'load' && '24.21.0' || '24' }}
          cache: npm
      - run: npm ci
      # 字体缓存：MiSans 全量包（约 20 MB，hyperos.mi.com）在托管运行器上下载曾超时。键取 tools/fonts.mjs 的哈希
      # （其中固定了字体版本与 SHA-256），换字体自动失效；命中时跳过下载，build 复制时仍逐个核对 SHA-256。
      - id: fonts-cache
        uses: actions/cache@v4
        with:
          path: build/fonts
          key: fonts-${{ hashFiles('tools/fonts.mjs') }}
      - if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: npm run fonts
      - name: 环境诊断实验：记录、临时干预并核对是否生效
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.envtest != ''
        shell: pwsh
        env:
          ENVTEST: ${{ github.event.inputs.envtest }}
        run: ./tools/ci-env-experiment.ps1 -Group $env:ENVTEST -Phase before
      # H1 负载条件（h1=load）：界面验收运行期间后台采样，并发度 1、每 5 秒一个样本。
      # 带负载、诊断用，不计入稳定性验收。
      - name: H1 负载实验：后台启动采样器（带负载、诊断用，不计入稳定性验收）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.h1 == 'load'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'h1-load.jsonl'
          $stop = Join-Path $env:RUNNER_TEMP 'h1-load.stop'
          $log = Join-Path $env:RUNNER_TEMP 'h1-load.log'
          $err = Join-Path $env:RUNNER_TEMP 'h1-load.err.log'
          Remove-Item $out, $stop, $log, $err -ErrorAction SilentlyContinue
          $samplerArgs = @('tools/h1-sampler.mjs', '--load', '--interval', '5000',
            '--out', "`"$out`"", '--stop-file', "`"$stop`"")
          $sampler = Start-Process -FilePath node -PassThru -NoNewWindow `
            -ArgumentList $samplerArgs -RedirectStandardOutput $log -RedirectStandardError $err
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'h1-load.pid') -Value $sampler.Id -Encoding utf8
      - run: npm run shots
        env:
          AR_SHOTS_FOCUS: ${{ github.event.inputs.focus }}
          AR_SHOTS_REPEAT: ${{ github.event.inputs.repeat }}
          AR_SHOTS_PROBE: ${{ github.event.inputs.probe }}
      - name: 环境诊断实验：结束时核对干预是否仍生效
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.envtest != ''
        shell: pwsh
        env:
          ENVTEST: ${{ github.event.inputs.envtest }}
        run: ./tools/ci-env-experiment.ps1 -Group $env:ENVTEST -Phase after
      # H1 负载条件：界面验收结束后（即使失败）写停止文件，等采样器退出，再打印日志与汇总。
      - name: H1 负载实验：停止采样并汇总（带负载、诊断用，不计入稳定性验收）
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.h1 == 'load'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'h1-load.jsonl'
          $stop = Join-Path $env:RUNNER_TEMP 'h1-load.stop'
          $pidFile = Join-Path $env:RUNNER_TEMP 'h1-load.pid'
          Set-Content -Path $stop -Value 'stop' -Encoding utf8
          if (Test-Path $pidFile) {
            $samplerId = [int](Get-Content $pidFile -Raw)
            $sampler = Get-Process -Id $samplerId -ErrorAction SilentlyContinue
            if ($sampler) { [void]$sampler.WaitForExit(120000) }
          }
          $log = Join-Path $env:RUNNER_TEMP 'h1-load.log'
          if (Test-Path $log) { Get-Content $log }
          $err = Join-Path $env:RUNNER_TEMP 'h1-load.err.log'
          if (Test-Path $err) { Get-Content $err }
          if (Test-Path $out) {
            node tools/h1-sampler.mjs --summarize $out
          } else {
            Write-Output 'H1：没有采样输出（采样器未启动或提前退出）'
          }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: app/dist/shots/
