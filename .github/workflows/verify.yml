name: verify
on:
  push:
    branches: [main, 'stage/**']
  pull_request:
  # 手动触发：单独复现某项界面检查（例如 focus=UI05、repeat=30），或开运行期探针跑完整界面验收（probe=1）；只跑 gui 作业。
  # 这两种都是专项实验，不计作完整界面回归（完整回归看 push / pull_request 触发的运行）。
  workflow_dispatch:
    inputs:
      focus:
        description: '只跑这一项（UI05、UI17-fail、newtask-load、core-spawn）；留空跑完整界面验收'
        required: false
        default: ''
      repeat:
        description: '单独复现时重复的轮数'
        required: false
        default: '30'
      probe:
        description: '1 = 完整界面验收期间开运行期对照探针（Electron-as-Node / node.exe 交替启动，见 shots-probe.ts）'
        required: false
        default: ''
      # 环境诊断实验（PR #5 CI）：baseline 只记录；storsvc 只停存储服务；compattel 只停启动 CompatTelRunner 的计划任务与进程。
      # 只在这台一次性运行器上临时生效，不是修复、不计作正式回归（见 tools/ci-env-experiment.ps1）。
      envtest:
        description: '环境诊断实验组：baseline / storsvc / compattel；留空不做'
        required: false
        default: ''
      # H1 隔离实验（诊断用，只手动触发，不计入稳定性验收；工具见 tools/h1-sampler.mjs）：
      # quiet = 单独跑安静条件采样；load = 界面验收期间带负载采样。留空不跑。
      h1:
        description: 'H1 实验：quiet / load；留空不跑'
        required: false
        default: ''
      # 单项连续重复运行（诊断用，只手动触发，不计入完整回归；工具见 tools/repeat-test.mjs）。
      # 目前可填 agents-test-timeout；留空不跑。次数沿用上面的 repeat 输入（默认 30）。
      nodetest:
        description: '单独连续重复跑一条 node:test 用例（诊断用，目前可填 agents-test-timeout；留空不跑）'
        required: false
        default: ''
      # 只在 Linux 上跑 lint:tree 与 verify（诊断用，复现只在 Linux 上失败的测试；只手动触发，不计作正式回归）。
      linux:
        description: '1 = 只在 ubuntu-latest 上跑 lint:tree 与 verify（诊断用，不计作正式回归）；留空不跑'
        required: false
        default: ''
jobs:
  windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # verify 不启动 Electron，省下载时间
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:tree
      - run: npm run verify
  # Linux 复现（诊断用）：只手动触发（workflow_dispatch 且 linux 非空），不挂 push / pull_request。
  # lint:tree 失败时 verify 仍然运行，一次看到全部问题；verify 的完整日志与 TAP 作为产物上传，不计作正式回归。
  linux:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.linux != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # verify 不启动 Electron，省下载时间
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:tree
      - if: always()
        run: npm run verify
      # 日志目录以 os.tmpdir() 为准（verify 写在其下的 agent-router-verify/），不写死路径。
      - id: logdir
        if: always()
        run: echo "dir=$(node -p "require('os').tmpdir()")/agent-router-verify" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verify-logs
          path: ${{ steps.logdir.outputs.dir }}
          retention-days: 7
  # 单项连续重复运行（诊断用）：只手动触发（workflow_dispatch 且 nodetest 非空），不挂 push / pull_request。
  # 只重复跑一个 node:test 用例，次数沿用 repeat 输入（默认 30）；输入经 env 传入，不直接拼进脚本。
  # 诊断用，不替代三连续完整回归。
  nodetest:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.nodetest != ''
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NODETEST: ${{ github.event.inputs.nodetest }}
      REPEAT: ${{ github.event.inputs.repeat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tools/repeat-test.mjs $env:NODETEST $env:REPEAT
  # H1 隔离实验的安静条件：只手动触发（workflow_dispatch 且 h1=quiet），不挂在 push / pull_request 上。
  # 独立 Node 固定 24.21.0，与 Electron 43.7.5 内置的 Node 版本一致；不一致时采样器会在输出里醒目标出。
  # 诊断用，不计入稳定性验收。
  h1:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.h1 == 'quiet'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: node tools/h1-sampler.mjs --quiet
  # 界面验收（真实输入、每页通用检查、UI 基线）。验收窗口不显示，不需要桌面会话。
  gui:
    # 手动触发且开了单项重复运行（nodetest 非空）时只跑 nodetest，不跑界面验收。
    # 手动触发且开了 Linux 复现（linux 非空）时只跑 linux 作业，也不跑界面验收。
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.h1 != 'quiet' && github.event.inputs.nodetest == '' && github.event.inputs.linux == '')
    runs-on: windows-latest
    # 界面检查 v0.7.5 是 1572 项，CI 上 30 分钟跑不完（v0.7.0 的 1424 项已用 28 分 44 秒），放宽到 50 分钟；只改超时，不改检查。
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 只有 H1 负载实验要用与 Electron 内置 Node 相同的版本（24.21.0），其余情况仍是 24。
          node-version: ${{ github.event.inputs.h1 == 'load' && '24.21.0' || '24' }}
          cache: npm
      - run: npm ci
      # 字体缓存：MiSans 全量包（约 20 MB，hyperos.mi.com）在托管运行器上下载曾超时。键取 tools/fonts.mjs 的哈希
      # （其中固定了字体版本与 SHA-256），换字体自动失效；命中时跳过下载，build 复制时仍逐个核对 SHA-256。
      - id: fonts-cache
        uses: actions/cache@v4
        with:
          path: build/fonts
          key: fonts-${{ hashFiles('tools/fonts.mjs') }}
      - if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: npm run fonts
      - name: 环境诊断实验：记录、临时干预并核对是否生效
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.envtest != ''
        shell: pwsh
        env:
          ENVTEST: ${{ github.event.inputs.envtest }}
        run: ./tools/ci-env-experiment.ps1 -Group $env:ENVTEST -Phase before
      # H1 负载条件（h1=load）：启动采样器、界面验收、停止与汇总必须在同一个步骤里完成。
      # GitHub Actions 会在步骤结束时结束该步骤启动的进程，跨步骤的后台采样器活不过启动它的步骤
      # （029 的三次运行只采到 0～1 个样本）。带负载、诊断用，不计入稳定性验收；
      # 采样或汇总出错只打印，步骤退出码始终等于界面验收（npm run shots）。
      - name: H1 负载实验：界面验收期间采样并汇总（带负载、诊断用，不计入稳定性验收）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.h1 == 'load'
        shell: pwsh
        env:
          AR_SHOTS_FOCUS: ${{ github.event.inputs.focus }}
          AR_SHOTS_REPEAT: ${{ github.event.inputs.repeat }}
          AR_SHOTS_PROBE: ${{ github.event.inputs.probe }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'h1-load.jsonl'
          $stop = Join-Path $env:RUNNER_TEMP 'h1-load.stop'
          $log = Join-Path $env:RUNNER_TEMP 'h1-load.log'
          $err = Join-Path $env:RUNNER_TEMP 'h1-load.err.log'
          Remove-Item $out, $stop, $log, $err -ErrorAction SilentlyContinue

          # 1. 后台启动采样器（并发度 1，每 5 秒一个样本）。启动失败只打印，界面验收照常跑。
          $sampler = $null
          try {
            $samplerArgs = @('tools/h1-sampler.mjs', '--load', '--interval', '5000',
              '--out', "`"$out`"", '--stop-file', "`"$stop`"")
            $sampler = Start-Process -FilePath node -PassThru -NoNewWindow `
              -ArgumentList $samplerArgs -RedirectStandardOutput $log -RedirectStandardError $err -ErrorAction Stop
            Write-Output "H1：采样器已启动（PID $($sampler.Id)）"
          } catch {
            Write-Output "H1：采样器启动失败：$($_.Exception.Message)"
          }

          # 2. 前台跑界面验收，记下它的退出码；本步骤最后用它退出。
          npm run shots
          $shotsExit = $LASTEXITCODE
          if ($null -eq $shotsExit) { $shotsExit = 1 }

          # 3. 写停止文件，等采样器退出（上限 120 秒）；写不了停止文件或超时就结束它的进程树。
          $stopWritten = $false
          try {
            Set-Content -Path $stop -Value 'stop' -Encoding utf8
            $stopWritten = $true
          } catch {
            Write-Output "H1：写停止文件失败：$($_.Exception.Message)"
          }
          try {
            if ($sampler -and -not $sampler.HasExited) {
              if (-not $stopWritten) {
                Write-Output "H1：无法写停止文件，直接结束采样器的进程树（PID $($sampler.Id)）"
                & taskkill /PID $sampler.Id /T /F
                [void]$sampler.WaitForExit(30000)
              } elseif (-not $sampler.WaitForExit(120000)) {
                Write-Output "H1：采样器 120 秒内未退出，结束它的进程树（PID $($sampler.Id)）"
                & taskkill /PID $sampler.Id /T /F
                [void]$sampler.WaitForExit(30000)
              }
            }
          } catch {
            Write-Output "H1：等待或结束采样器时出错：$($_.Exception.Message)"
          }

          # 4. 打印采样器日志与汇总；样本数为 0 时醒目提示。任何错误都只打印，不改变退出码。
          try {
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path $err) { Get-Content $err }
            if (Test-Path $out) {
              node tools/h1-sampler.mjs --summarize $out
              $sampleCount = @(Get-Content $out | Where-Object { $_.Trim() }).Count
              if ($sampleCount -eq 0) { Write-Output '::warning::H1：没有采样输出' }
            } else {
              Write-Output '::warning::H1：没有采样输出'
            }
          } catch {
            Write-Output "H1：打印日志或汇总时出错：$($_.Exception.Message)"
          }

          exit $shotsExit
      # 界面验收：H1 负载实验时已经在上一步里跑过，不再重复；其余情况（含 push / pull_request、
      # h1 为空或 quiet）照常运行。
      # h1 不是 load 时，上面的 H1 步骤显示为跳过、不执行（工作流是静态的，步骤不能按输入消失）。
      - if: github.event.inputs.h1 != 'load'
        run: npm run shots
        env:
          AR_SHOTS_FOCUS: ${{ github.event.inputs.focus }}
          AR_SHOTS_REPEAT: ${{ github.event.inputs.repeat }}
          AR_SHOTS_PROBE: ${{ github.event.inputs.probe }}
      - name: 环境诊断实验：结束时核对干预是否仍生效
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.envtest != ''
        shell: pwsh
        env:
          ENVTEST: ${{ github.event.inputs.envtest }}
        run: ./tools/ci-env-experiment.ps1 -Group $env:ENVTEST -Phase after
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: app/dist/shots/
